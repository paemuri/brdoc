image: debian/testing
packages:
  - golang-go
  - gcc
  - libc6-dev
sources:
  - https://git.sr.ht/~paemuri/brdoc
environment:
  GOFLAGS: -mod=readonly
tasks:
  - gofmt: |
      cd brdoc
      test -z "$(gofmt -s -l . | tee /dev/stderr)"
  - vet: |
      cd brdoc
      go vet ./...
  - staticcheck: |
      cd brdoc
      go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      staticcheck ./...
  - test: |
      cd brdoc
      go test -race ./...
  - govulncheck: |
      cd brdoc
      go install golang.org/x/vuln/cmd/govulncheck@latest
      govulncheck ./...
  - fuzz: |
      cd brdoc
      go test -run XXX -fuzz FuzzAll -fuzztime 30s .
